# ═══════════════════════════════════════════════════════════════
#   yumingfenfa（域名分发）自动部署工作流
#   推送到 main 分支即自动部署到 Cloudflare
# ═══════════════════════════════════════════════════════════════
#
# 使用方式：
#   1. 在 GitHub 网页上打开此文件，点 ✏️ 编辑
#   2. 把下面所有 ******** 替换成你的真实密钥
#   3. 提交到 main 分支，自动触发部署
#   （D1 数据库和 KV 命名空间会自动创建，无需手动设置）
#
# 注意：不要在任何地方公开这些密钥！

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# ═══════════════════════════════════════════════════════════════
#  密钥填写区域 — 把 ******** 替换为实际值
# ═══════════════════════════════════════════════════════════════
env:
  # ─── 1. Cloudflare 凭据（必须） ─────────────────────────────
  CLOUDFLARE_API_TOKEN: ********
  # 说明：Cloudflare API 令牌，用于部署 Worker、自动创建 D1/KV/R2 等资源
  # 获取步骤：
  #   1. https://dash.cloudflare.com → 右上角头像 → My Profile → API Tokens
  #   2. Create Token → 模板选 "Edit Cloudflare Workers"
  #   3. Permissions：Workers Scripts:Edit, D1:Edit, KV:Edit, R2:Edit, AI:Edit
  #   4. Account Resources 选你的账户 → Create Token → 复制 Token

  CLOUDFLARE_ACCOUNT_ID: ********
  # 说明：Cloudflare 账户 ID
  # 获取方式：Dashboard → 右侧边栏 → Account ID

  CF_ZONE_ID: ********
  # 说明：主域名的 Zone ID，用于子域名 DNS 分发
  # 获取方式：Dashboard → 你的域名 → 右侧边栏 → Zone ID

  # ─── 2. JWT 签名密钥（必须） ───────────────────────────────
  JWT_SECRET: ********
  # 说明：任意长随机字符串，用于签名登录 Token
  # 生成：openssl rand -hex 32 或 node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"

  # ─── 3. GitHub OAuth 登录（必须，否则无法用 GitHub 登录） ──
  # 获取方式：https://github.com/settings/developers → New OAuth App
  # Authorization callback URL 填：https://你的域名.com/auth/github/callback
  GITHUB_CLIENT_ID: ********
  GITHUB_CLIENT_SECRET: ********

  # ─── 4. DNS 分发 Token（必须，否则无法自动创建子域名 DNS 记录） ──
  # Cloudflare API Token，权限：Zone → DNS → Edit
  # 获取方式：Dashboard → My Profile → API Tokens → Create Custom Token
  CF_API_TOKEN: ********

  # ─── 5. 域名配置（必须） ───────────────────────────────────
  BASE_DOMAIN: ********
  # 说明：你的主域名，如 example.com（不要带 https://）

  PLATFORM_NAME: 域名分发
  JWT_ISSUER: yumingfenfa

# ═══════════════════════════════════════════════════════════════
#  以下为部署逻辑，无需修改
# ═══════════════════════════════════════════════════════════════

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ─── 自动创建 Cloudflare 资源并配置 wrangler.toml ─────
      - name: Auto-create D1 & KV & configure wrangler.toml
        run: |
          node -e "
          const {execSync}=require('child_process');
          const fs=require('fs');
          const wrangler='npx wrangler';
          function run(cmd){
            try{return execSync(cmd,{encoding:'utf8',stdio:['pipe','pipe','pipe']})}catch(e){return e.stdout||''}
          }
          function jsonRun(cmd){
            try{return JSON.parse(execSync(cmd,{encoding:'utf8',stdio:['pipe','pipe','pipe']}))}catch(e){return null}
          }

          // ── D1 数据库 ──
          console.log('D1 数据库...');
          let d1=jsonRun(wrangler+' d1 create yumingfenfa --json');
          let d1Id=d1?.result?.uuid;
          if(!d1Id){
            let list=jsonRun(wrangler+' d1 list --json');
            if(Array.isArray(list)){let db=list.find(x=>x.name==='yumingfenfa');if(db)d1Id=db.uuid;}
            if(!Array.isArray(list)&&list?.result){let db=list.result.find(x=>x.name==='yumingfenfa');if(db)d1Id=db.uuid;}
          }
          if(!d1Id){console.error('无法获取 D1 ID');process.exit(1);}
          console.log('D1 ID:', d1Id);

          // ── KV 命名空间 ──
          console.log('KV 命名空间...');
          let kv=jsonRun(wrangler+' kv namespace create yumingfenfa --json');
          let kvId=kv?.result?.id||kv?.id;
          if(!kvId){
            let list=jsonRun(wrangler+' kv namespace list --json');
            if(Array.isArray(list)){let ns=list.find(x=>x.title==='yumingfenfa');if(ns)kvId=ns.id;}
            if(!Array.isArray(list)&&list?.result){let ns=list.result.find(x=>x.title==='yumingfenfa');if(ns)kvId=ns.id;}
          }
          if(!kvId){console.error('无法获取 KV ID');process.exit(1);}
          console.log('KV ID:', kvId);

          // ── R2 Bucket ──
          console.log('R2 bucket...');
          run(wrangler+' r2 bucket create yumingfenfa-assets');
          console.log('R2 bucket');

          // ── 写入 wrangler.toml ──
          let t=fs.readFileSync('wrangler.toml','utf8');
          t=t.replace('REPLACE_WITH_D1_DATABASE_ID',d1Id);
          t=t.replace('REPLACE_WITH_KV_NAMESPACE_ID',kvId);
          t=t.replace(/yourdomain\.com/g, process.env.BASE_DOMAIN);
          fs.writeFileSync('wrangler.toml',t);
          console.log('wrangler.toml 已配置');
          "

      # 应用 D1 数据库迁移
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply yumingfenfa --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      # 部署 Worker
      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}

      # 写入加密变量
      - name: Set Worker secrets
        run: |
          echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET
          echo "$GITHUB_CLIENT_ID" | npx wrangler secret put GITHUB_CLIENT_ID
          echo "$GITHUB_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET
          echo "$CF_API_TOKEN" | npx wrangler secret put CF_API_TOKEN
          echo "$CF_ZONE_ID" | npx wrangler secret put CF_ZONE_ID
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          GITHUB_CLIENT_ID: ${{ env.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ env.GITHUB_CLIENT_SECRET }}
          CF_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ env.CF_ZONE_ID }}

      - name: Summary
        run: |
          echo "### Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- D1 + KV + R2 自动创建/获取" >> $GITHUB_STEP_SUMMARY
          echo "- D1 migrations applied" >> $GITHUB_STEP_SUMMARY
          echo "- Worker yumingfenfa deployed" >> $GITHUB_STEP_SUMMARY
          echo "- Secrets written to Worker" >> $GITHUB_STEP_SUMMARY