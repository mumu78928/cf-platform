name = "yumingfenfa"
main = "src/index.tsx"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]

# Routes
# 主域名 + 通配子域名。部署前请将 BASE_DOMAIN 改为你的域名，并在 Cloudflare DNS
# 里加一条通配记录：  *.yourdomain.com   (proxied, 指向任意占位 IP 如 192.0.2.1)
# 然后在 Cloudflare Dashboard 中给该 Worker 添加 routes：
#   yourdomain.com/*
#   *.yourdomain.com/*
# 也可改成 custom_domain 形式（不支持通配），按需选择。
routes = [
  { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" },
  { pattern = "*.yourdomain.com/*", zone_name = "yourdomain.com" }
]

# D1 (关系型数据库)
[[d1_databases]]
binding = "DB"
database_name = "yumingfenfa"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

# KV (会话 / 缓存 / 限流)
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# R2 (对象存储：头像 / 上传)
[[r2_buckets]]
binding = "R2"
bucket_name = "yumingfenfa-assets"

# Workers AI
[ai]
binding = "AI"

# 非敏感变量（敏感项放 Secret / .dev.vars）
[vars]
BASE_DOMAIN = "yourdomain.com"
PLATFORM_NAME = "域名分发"
JWT_ISSUER = "yumingfenfa"

# Secret（用 `wrangler secret put <NAME>` 或 GitHub Actions 配置，勿写这里）：
#   JWT_SECRET          - JWT 签名密钥（任意长随机串）
#   GITHUB_CLIENT_ID    - GitHub OAuth App Client ID
#   GITHUB_CLIENT_SECRET- GitHub OAuth App Client Secret
#   CF_API_TOKEN        - 用于 DNS 分发（Zone:DNS:Edit 权限）
#   CF_ZONE_ID          - 主域名所在 Zone ID

# 静态资源（管理后台 CSS 等）
[assets]
directory = "./public"
binding = "ASSETS"
